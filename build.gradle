unimined.minecraft {
    version '1.12.2'

    mappings {
        mcp 'stable', '39-1.12'
    }

    cleanroom {
        if (actiniumProjectAccessTransformer != null) {
            accessTransformer actiniumProjectAccessTransformer.absolutePath
        }

        loader '0.6.7-alpha'

        runs.all {
            args += ['--username', propertyString('minecraft_username')]
            def extraArgs = propertyString('extra_jvm_args')
            if (extraArgs != null && !extraArgs.trim().isEmpty()) {
                jvmArgs += extraArgs.split('\\s+').toList()
            }

            // Unimined omits source output paths here when a clean build has not created their directories yet.
            def extraPathArgument = '-Dcrl.dev.extrapath='
            def extraPaths = new LinkedHashSet<String>()
            extraPaths.addAll(project.sourceSets.main.output.files.collect { it.absolutePath })
            jvmArgs.findAll { it.toString().startsWith(extraPathArgument) }.each { argument ->
                extraPaths.addAll(argument.toString().substring(extraPathArgument.length()).tokenize(File.pathSeparator))
            }
            jvmArgs = jvmArgs.findAll { !it.toString().startsWith(extraPathArgument) }
            jvmArgs += "${extraPathArgument}${extraPaths.join(File.pathSeparator)}"

            if (propertyBool('is_coremod')) {
                systemProperty 'fml.coreMods.load', propertyString('coremod_plugin_class_name')
            }
        }
    }

    defaultRemapJar = false

    remap(tasks.named('jar').get()) {
        mixinRemap {
            enableBaseMixin()
            enableMixinExtra()
        }
    }

    remapCompatBridgeJar = remap(compatBridgeJar.get(), 'remapCompatBridgeJar') {
        group = 'build'
        description = 'Remaps the legacy Celeritas compatibility bridge for production.'
        asJar {
            archiveBaseName.set('celeritas-compat-bridge')
            archiveVersion.set(project.version.toString())
            archiveClassifier.set('')
        }
        mixinRemap {
            enableBaseMixin()
            enableMixinExtra()
        }
    }

    mods {
        remap(configurations.modCompileOnly)
        remap(configurations.modRuntimeOnly)
    }
}

def compatBridgeRemapOutput = remapCompatBridgeJar.flatMap { it.archiveFile }
def prepareCompatBridgeRun = tasks.register('prepareCompatBridgeRun') {
    group = 'build'
    description = 'Installs the remapped Celeritas compatibility bridge into the client run directory.'
    dependsOn remapCompatBridgeJar
    inputs.file(compatBridgeRemapOutput)
    outputs.upToDateWhen { false }

    doLast {
        def runModsDirectory = layout.projectDirectory.dir('run/client/mods').asFile
        if (!runModsDirectory.exists() && !runModsDirectory.mkdirs()) {
            throw new GradleException("Failed to create client mods directory: ${runModsDirectory}")
        }
        fileTree(runModsDirectory).matching {
            include 'celeritas-compat-bridge-*.jar'
        }.files.each { existingJar ->
            if (!existingJar.delete()) {
                throw new GradleException("Failed to remove stale compatibility bridge jar: ${existingJar}")
            }
        }
        copy {
            from compatBridgeRemapOutput
            into runModsDirectory
        }
    }
}

