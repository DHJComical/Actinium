plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.cleanroommc.com' }
    maven { url = 'https://nexus.gtnewhorizons.com/repository/public/' }
    mavenLocal()
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir '../src/lwjglCommon/java'
            srcDir '../src/lwjgl3/java'
        }
    }
}

dependencies {
    api project(':GTNHLib')
    // shaderc/spvc are used at compile time by the GLSL->SPIRV pipeline; the runtime
    // natives are provided by the sdl-gpu module.
    compileOnly 'org.lwjgl:lwjgl-shaderc:3.4.1'
    compileOnly 'org.lwjgl:lwjgl-spvc:3.4.1'
}
