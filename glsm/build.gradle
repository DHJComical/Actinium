plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.cleanroommc.com' }
    maven { url = 'https://nexus.gtnewhorizons.com/repository/public/' }
    // com.cleanroommc:lwjglx:1.0.0 (LWJGL2 compatibility layer used by test fixtures)
    maven { url = 'https://maven.arcseekers.com/releases' }
    mavenLocal()
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir '../src/lwjglCommon/java'
            srcDir '../src/lwjgl3/java'
        }
    }
}

dependencies {
    api project(':GTNHLib')
    // shaderc/spvc are used at compile time by the GLSL->SPIRV pipeline; the runtime
    // natives are provided by the sdl-gpu module.
    compileOnly 'org.lwjgl:lwjgl-shaderc:3.4.1'
    compileOnly 'org.lwjgl:lwjgl-spvc:3.4.1'

    testFixturesImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testFixturesImplementation 'org.lwjgl:lwjgl-opengl:3.4.1'
    testFixturesImplementation 'org.lwjgl:lwjgl:3.4.1'
    testFixturesImplementation 'com.cleanroommc:lwjglx:1.0.0'
}
